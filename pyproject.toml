[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-drawer"
version = "0.1.0"
description = "Workflow-oriented experimental image generation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
part-bank = ["Pillow>=12.3.0,<13"]
openclip = ["open-clip-torch>=3.3,<4", "safetensors>=0.4", "Pillow>=12.3.0,<13"]
dev = [
  "ruff==0.15.22",
  "build>=1.2",
  "pytest>=8.0",
  "Pillow>=12.3.0,<13",
]

[project.scripts]
image-drawer = "image_drawer.cli:main"
image-drawer-gui = "image_drawer.gui:main"
image-drawer-part-bank = "image_drawer.part_bank.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["image_drawer*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "models", "reports", "artifacts", "datasets", "vendor", "tests/fixtures"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
