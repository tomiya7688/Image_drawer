[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-drawer"
version = "0.1.0"
description = "Workflow-oriented experimental image generation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
part-bank = ["Pillow>=12.3.0,<13"]
training = ["torch>=2.6,<3"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "Pillow>=12.3.0,<13",
]

[project.scripts]
image-drawer = "image_drawer.cli:main"
image-drawer-gui = "image_drawer.gui:main"
image-drawer-part-bank = "image_drawer.part_bank.cli:main"
image-drawer-train-part-selector = "image_drawer.training.part_selector_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["image_drawer*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
