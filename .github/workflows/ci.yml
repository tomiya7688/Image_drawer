name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify input/output contracts
        run: python -m pytest

      - name: Build distribution
        run: python -m build

      - name: Verify built wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl
          python scripts/verify_built_artifact.py \
            "$PWD/.ci-venv/bin/image-drawer" \
            "$PWD/.ci-venv/bin/image-drawer-gui"

      - name: Verify installed Part Bank ingest and actual crop pixels
        shell: bash
        run: |
          set -euo pipefail
          wheel=("$PWD"/dist/*.whl)
          .ci-venv/bin/python -m pip install "${wheel[0]}[part-bank]"
          .ci-venv/bin/python -m pip check
          python scripts/verify_part_bank_artifact.py \
            "$PWD/.ci-venv/bin/python" \
            "$PWD/.ci-venv/bin/image-drawer-part-bank"
