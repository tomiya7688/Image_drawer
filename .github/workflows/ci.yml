name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify input/output contracts
        run: python -m pytest

      - name: Build distribution
        run: python -m build

      - name: Verify built wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl
          python scripts/verify_built_artifact.py             .ci-venv/bin/image-drawer             .ci-venv/bin/image-drawer-gui
