name: 作業Issue
description: 実装・修正・調査などの作業を起票します。優先度は必須です。
body:
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: "P0は重大障害・セキュリティ事故など緊急専用。一般的な高優先はP1、通常はP2です。依存関係と未処理PRも確認してください。"
      options:
        - "P0 - 緊急"
        - "P1 - 高"
        - "P2 - 通常"
        - "P3 - 低"
        - "P4 - 保留・長期"
      default: 2
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景と目的
      description: なぜ必要かを書いてください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 完了と判断できる条件を書いてください。
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 設計書（リンクと節）
      description: 実装Issueは、対応する設計書のリンクと節を書いてください。設計書が無い場合は「設計PRが先」と書き、設計のIssueとして起票してください。
    validations:
      required: true
